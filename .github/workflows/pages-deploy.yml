name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    env:
      WRANGLER_VERSION: "4.151.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install deployment runtime
        run: |
          WORKERD_VERSION=$(npm view "wrangler@$WRANGLER_VERSION" dependencies.workerd)
          npm install --no-save --package-lock=false --include=optional \
            "wrangler@$WRANGLER_VERSION" "@cloudflare/workerd-linux-64@$WORKERD_VERSION"
          npx --no-install wrangler --version

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: "npm"
          command: pages deploy dist --project-name=xiuxiuyingyu --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
