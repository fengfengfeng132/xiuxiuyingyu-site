name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    env:
      WRANGLER_VERSION: "4.151.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install deployment runtime
        run: |
          WORKERD_VERSION=$(npm view "wrangler@$WRANGLER_VERSION" dependencies.workerd)
          npm install --prefix "$RUNNER_TEMP/xiuxiu-wrangler" --include=optional \
            "wrangler@$WRANGLER_VERSION" "@cloudflare/workerd-linux-64@$WORKERD_VERSION"
          "$RUNNER_TEMP/xiuxiu-wrangler/node_modules/.bin/wrangler" --version

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/xiuxiu-wrangler/node_modules/.bin/wrangler" pages deploy dist --project-name=xiuxiuyingyu --branch=main
